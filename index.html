<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шиномонтаж</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <h1>Шиномонтаж</h1>
  </header>

  <!-- Форма записи -->
  <div class="card" id="guestCard">
    <h2>Запись</h2>
    <div class="form-row">
      <input type="text" id="guestName" placeholder="Ваше имя">
      <input type="text" id="guestPhone" placeholder="Телефон">
      <select id="guestCarType">
        <option>Легковая</option>
        <option>Кроссовер</option>
        <option>Внедорожник</option>
        <option>Микроавтобус</option>
        <option>Грузовые</option>
        <option>Коммерческий транспорт</option>
      </select>
      <select id="radiusSelect">
        <option>R13</option>
        <option>R14</option>
        <option>R15</option>
        <option>R16</option>
        <option>R17</option>
        <option>R18</option>
        <option>R19</option>
        <option>R20</option>
        <option>R21</option>
      </select>
      <select id="serviceSelect">
        <option>Балансировка</option>
        <option>Смена резины</option>
        <option>Смена резины с балансировкой</option>
      </select>
      <input type="date" id="guestDate">
      <select id="guestTime"></select>
      <div class="hint">Цена: <span id="priceDisplay">-</span></div>
      <button onclick="addGuestRecord()">Записаться</button>
    </div>
  </div>

  <!-- Контакты -->
  <div class="card">
    <h2>Контакты</h2>
    <p>Дмитрий: 0937900765</p>
    <p>Владислав: 0969575306</p>
    <a href="https://t.me/VladyslavShunu" target="_blank"><button>Написать в Telegram</button></a>
    <a href="https://maps.app.goo.gl/hDVFX9WXePfR5HTh9" target="_blank"><button>Мы на карте</button></a>
    <p>Работаем с 8:00 до 17:00</p>
  </div>

  <!-- Вход -->
  <div class="card" id="loginCard">
    <h2>Вход</h2>
    <input type="text" id="loginInput" placeholder="Логин">
    <input type="password" id="passwordInput" placeholder="Пароль">
    <button onclick="login()">Войти</button>
  </div>

  <!-- Кабинет босса -->
  <div class="card hidden" id="bossCard">
    <h2>Кабинет Босса</h2>
    <button onclick="changeCredentials()">Сменить логин/пароль</button>
    <button onclick="createWorker()">Создать работника</button>
    <div class="top-actions">
      <button onclick="setBossFilter('day')">День</button>
      <button onclick="setBossFilter('week')">Неделя</button>
      <button onclick="setBossFilter('month')">Месяц</button>
      <span id="bossTotal">Сумма: 0 грн</span>
    </div>
    <div id="bossRecords"></div>
  </div>

  <!-- Кабинет работника -->
  <div class="card hidden" id="workerCard">
    <h2>Кабинет Работника</h2>
    <button onclick="changeCredentials()">Сменить логин/пароль</button>
    <div id="workerRecords"></div>
  </div>

  <button id="logoutBtn" class="hidden" onclick="logout()">Выйти</button>

</div>
<script src="script.js"></script>
</body>
</html>
